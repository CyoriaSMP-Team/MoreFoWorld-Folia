name: Upstream sync review

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: CyoriaSMP-Team/Folia-Ports/.github/workflows/upstream-sync.yml@main
    with:
      upstream_repo: Folia-Inquisitors/MoreFoWorld
      upstream_branch: master
      target_branch: folia/1.21.11
      java_version: '21'
      build_system: gradle
      build_command: ./gradlew build
