name: Build & Release

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            changelog="$(git log --no-merges --format='- %s' "${previous_tag}..${GITHUB_SHA}")"
          else
            changelog="$(git log -10 --no-merges --format='- %s' "$GITHUB_SHA")"
          fi
          if [ -z "$changelog" ]; then
            changelog="Maintenance release ${GITHUB_REF_NAME}."
          fi
          {
            echo 'changelog<<CHANGELOG_EOF'
            printf '%s\n' "$changelog"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Read version
        id: version
        run: |
          echo "::set-output name=version::$(cat version | head -n 1)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build

      - name: Release
        uses: HSGamer/MCReleaser@master
        with:
          files: build/libs/MoreFoWorld-*-all.jar
        env:
          DESCRIPTION: ${{ steps.changelog.outputs.changelog }}
          GAME_VERSIONS: ${{ steps.version.outputs.version }}

          GITHUB_TOKEN: ${{ github.token }}

          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: saPdoNQI
          MODRINTH_LOADERS: folia

          HANGAR_KEY: ${{ secrets.HANGAR_KEY }}
          HANGAR_PROJECT: MoreFoWorld
          HANGAR_PLATFORM: paper
