name: Folia 1.21.11 development build

on:
  push:
    branches: [folia/1.21.11]
  pull_request:
    branches: [folia/1.21.11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folia-12111-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run available tests
        run: ./gradlew --no-daemon --max-workers=2 --console=plain build
      - name: Upload development artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morefoworld-folia-1.21.11-${{ github.run_number }}
          path: build/libs/MoreFoWorld-*-all.jar
          if-no-files-found: error
          retention-days: 7
